# 中免会员 x-access-token 抓取（Quantumult X 远程重写）
#
# 用法一：作为独立的远程重写资源引用本文件
# 用法二：合并到现有的 get_cookie.conf
#   1) 在 hostname 行追加：cdfmbrapi.cdfg.com.cn
#   2) 复制 [rewrite_local] 下的规则到你的规则列表

[rewrite_local]
^https:\/\/cdfmbrapi\.cdfg\.com\.cn\/api\/user\/(signRecord|sign) url script-request-header https://raw.githubusercontent.com/lanzcer/QuantumultX/refs/heads/main/cdf_member_token.js

[mitm]
hostname = %APPEND% cdfmbrapi.cdfg.com.cn
